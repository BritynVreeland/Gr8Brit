version: "2026-10-06.1"
gates:
  evidence:
    min_items: 5
    min_independent_authors: 3
    or_min_first_party: 2
  novelty_max_cosine_90d: 0.85
  max_recs_per_cluster: 2
opportunity_strength:
  weights: {demand: 0.30, intent_pain: 0.25, right_to_win: 0.20, gap: 0.15, momentum: 0.10}
  confidence_floor: 0.5        # C_adj = floor + (1-floor)*C
  momentum_min_baseline_weeks: 8
concept_value:
  history_prior_k: 5           # shrinkage strength toward account mean
  pairwise_blend: 0.4          # final = 0.6*value + 0.4*pairwise win rate
portfolio:
  brit_in_istanbul:
    slots: {education: 2, trust: 1, lead: 2, storytelling: 1}   # 6/week; min 3
    optional: {experiment: 1}
  brit_and_berat:
    slots: {conversion: 1, proof: 1, education: 1}              # 3 unique/week (offer-education)
  diversity: {max_per_cluster: 2, max_per_taxonomy_branch: 3, min_formats: 2}
