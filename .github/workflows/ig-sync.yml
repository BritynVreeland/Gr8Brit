name: instagram-sync
# Twice daily so stories are captured before they expire (insights vanish after 24h).
on:
  schedule:
    - cron: "7 3 * * *"    # 06:07 Istanbul
    - cron: "7 15 * * *"   # 18:07 Istanbul
  workflow_dispatch:
    inputs:
      max_media:
        description: "Limit media per account (blank = all; use for first backfill in chunks)"
        required: false

concurrency: instagram-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      AUTHOR_HASH_SALT: ${{ secrets.AUTHOR_HASH_SALT }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --no-dev
      - name: Sync
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$META_ACCESS_TOKEN" ]; then
            echo "::notice::Secrets not configured yet (docs/SETUP.md); skipping"; exit 0
          fi
          uv run bbos db migrate && uv run bbos seed
          if [ -n "${{ inputs.max_media }}" ]; then
            uv run bbos ig sync --max-media "${{ inputs.max_media }}"
          else
            uv run bbos ig sync
          fi
