[project]
name = "bbos"
version = "0.1.0"
description = "Brit & Berat Content Intelligence OS"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.11",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyyaml>=6.0",
  "typer>=0.12",
]

[project.scripts]
bbos = "bbos.cli:app"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bbos"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option defaults are the idiomatic Typer pattern

[tool.pytest.ini_options]
testpaths = ["tests"]
